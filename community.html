<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SmogMission | Community</title><style>*{box-sizing:border-box}body{margin:0;background:#091827;color:#eaf7ff;font:16px system-ui}header{padding:18px 24px;background:#112a3e;display:flex;justify-content:space-between}a{color:#7fe6d5}main{max-width:1120px;margin:25px auto;padding:0 16px}.layout{display:grid;grid-template-columns:210px 1fr;gap:18px}.panel{background:#10283b;border:1px solid #34566a;border-radius:18px;padding:18px}nav button{display:block;width:100%;margin:6px 0;padding:12px;text-align:left}button{border:0;border-radius:10px;background:#74dfca;color:#08252a;font-weight:700;cursor:pointer;padding:12px}nav button.active{background:#a7f5e7}#messages{height:53vh;overflow:auto;display:flex;flex-direction:column;gap:12px}.msg{background:#1c3b4e;border-radius:12px;padding:12px;overflow-wrap:anywhere}.meta{font-size:12px;color:#b3cbd5;margin-bottom:5px}.compose{display:flex;gap:8px;margin-top:14px}input{background:#071b2b;border:1px solid #527082;border-radius:10px;color:white;padding:12px;min-width:0;flex:1}#status{color:#b9d5db}@media(max-width:650px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;gap:6px}nav button{min-width:120px}#messages{height:48vh}}</style></head><body><header><strong>SmogMission · Community</strong><a href="/">← Dashboard</a></header><main><p>Welcome, {{ user_email | e }}. Public channels are visible to signed-in members. Never share private information.</p><div class="layout"><nav class="panel" aria-label="Channels"><button data-channel="general" class="active"># general</button><button data-channel="air-quality"># air-quality</button><button data-channel="space-missions"># space-missions</button><button data-channel="help"># help</button></nav><section class="panel"><h2 id="heading"># general</h2><div id="messages" role="log" aria-live="polite"></div><form class="compose" id="compose"><input id="body" maxlength="1000" required placeholder="Message the community" aria-label="Message"><button>Send</button></form><p id="status" role="status"></p></section></div></main><script>let channel='general';const box=document.getElementById('messages'),status=document.getElementById('status');async function load(){try{const r=await fetch('/api/community/messages?channel='+encodeURIComponent(channel));const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load');box.replaceChildren();for(const m of d.messages){const el=document.createElement('div');el.className='msg';const meta=document.createElement('div');meta.className='meta';meta.textContent=m.display_name+' · '+new Date(m.created_at).toLocaleString();const content=document.createElement('div');content.textContent=m.body;el.append(meta,content);box.append(el)}box.scrollTop=box.scrollHeight;status.textContent=''}catch(e){status.textContent=e.message}}document.querySelectorAll('[data-channel]').forEach(b=>b.onclick=()=>{channel=b.dataset.channel;document.getElementById('heading').textContent='# '+channel;document.querySelectorAll('[data-channel]').forEach(x=>x.classList.toggle('active',x===b));load()});document.getElementById('compose').onsubmit=async e=>{e.preventDefault();const input=document.getElementById('body');try{const r=await fetch('/api/community/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({channel,body:input.value,display_name:'Member'})});const d=await r.json();if(!r.ok)throw Error(d.error||'Failed');input.value='';await load()}catch(e){status.textContent=e.message}};load();setInterval(()=>{if(!document.hidden)load()},8000);</script></body></html>
